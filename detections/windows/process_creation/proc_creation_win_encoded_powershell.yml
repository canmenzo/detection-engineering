title: Encoded PowerShell Command Line
id: 6e1d6c2f-3b8a-4c4e-9b2a-1f0c7a5d9e21
status: experimental
description: >
  Detects PowerShell execution with an encoded command argument. Adversaries
  base64-encode commands to obfuscate intent and evade command-line inspection.

  PowerShell accepts any unambiguous abbreviation of -EncodedCommand, so an
  earlier version of this rule that listed -enc / -encodedcommand / -ec missed
  `powershell -e <base64>` — a documented evasion, and one the eval harness
  caught as a recall gap. The regex now accepts any -e* switch, with the
  precision coming from the argument: at least 15 characters of base64 alphabet.
  That length requirement is what keeps -ExecutionPolicy Bypass and friends out.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://learn.microsoft.com/powershell/module/microsoft.powershell.core/about/about_powershell_exe
author: Can Ozmen
date: 2026-06-23
modified: 2026-06-23
tags:
  - attack.execution
  - attack.t1059.001
  - attack.stealth
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\powershell.exe'
    - OriginalFileName: 'PowerShell.EXE'
  selection_enc:
    CommandLine|re: '\s-e[a-z]*\s+[A-Za-z0-9+/=]{15,}'
  condition: selection_img and selection_enc
falsepositives:
  - A PowerShell command line that passes a long base64-like value to an inner
    tool's -e switch (docker -e, for example) will match. Baseline by parent
    process.
  - Software deployment tools that legitimately pass encoded commands.
level: high
