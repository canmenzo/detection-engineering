name: detection-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  UV_PYTHON: "3.11"

jobs:
  python:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: ruff
        run: uv run ruff check .
      - name: mypy (strict)
        run: uv run mypy

  rules:
    name: rule discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: yamllint rules
        run: uv run yamllint detections/
      - name: sigma check
        # Advisory until the last logsource issues are resolved; see README.
        run: uv run sigma check detections/
      - name: metadata + fixture + ATT&CK tag discipline
        run: uv run detkit validate

  convert:
    runs-on: ubuntu-latest
    needs: [python, rules]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: convert to Splunk SPL
        run: |
          mkdir -p out
          uv run sigma convert -t splunk -p pipelines/splunk.yml detections/ -o out/splunk.spl
      - name: convert to Sentinel KQL
        run: uv run sigma convert -t kusto -p pipelines/sentinel.yml detections/ -o out/sentinel.kql

  test:
    runs-on: ubuntu-latest
    needs: [python, rules]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: install hayabusa
        run: |
          HV=$(cat .hayabusa-version)
          curl -sSL -o hayabusa.zip "https://github.com/Yamato-Security/hayabusa/releases/download/v${HV}/hayabusa-${HV}-lin-x64-gnu.zip"
          mkdir -p hayabusa && unzip -q hayabusa.zip -d hayabusa
          # keep the binary alongside its bundled rules/config (the harness runs from here)
          BIN=$(find hayabusa -name 'hayabusa-*-lin-*' -type f | head -n1)
          # An empty BIN here used to export a bogus HAYABUSA_BIN, every test
          # skipped, and the build went green having verified nothing.
          test -n "$BIN" || { echo "::error::hayabusa binary not found in release archive"; exit 1; }
          chmod +x "$BIN"
          echo "HAYABUSA_BIN=$PWD/$BIN" >> "$GITHUB_ENV"
      - name: pytest (unit + detection; fetches pinned samples, runs Hayabusa)
        # Refuse to pass on skipped detection tests. See tests/harness.py.
        env:
          DETKIT_REQUIRE_HAYABUSA: "1"
        run: uv run pytest -v

  eval:
    name: detection quality
    runs-on: ubuntu-latest
    needs: [python, rules]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: score every rule against its labelled events
        # Fails the build when a rule drops below the thresholds declared in its
        # own evals/<stem>/cases.yml. Results are published to the run summary so
        # every PR carries its detection-quality numbers.
        run: |
          set +e
          uv run detkit eval | tee eval-output.txt
          status="${PIPESTATUS[0]}"
          set -e
          {
            echo '## Detection quality'
            echo
            echo '```'
            cat eval-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  vendored:
    # Third-party SigmaHQ corpus: NOT held to the fixture gate (see vendored/README.md).
    # Proven at scale instead — every rule must batch-convert through the Splunk
    # backend, and all ATT&CK tags feed the coverage map.
    runs-on: ubuntu-latest
    needs: [python, rules]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: convert + coverage report over vendored corpus
        run: uv run detkit vendored

  coverage:
    runs-on: ubuntu-latest
    needs: [python, rules, convert, test, eval, vendored]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: regenerate every published artifact
        run: |
          uv run detkit vendored
          uv run detkit eval
          uv run detkit navigator
          uv run detkit coverage
          uv run detkit dashboard
      - name: committed artifacts must match what the generators produce
        # Generator output is a pure function of the corpus (no timestamps), so a
        # diff here means someone changed rules without regenerating and the
        # published dashboard no longer reflects the repo. PNGs are excluded:
        # matplotlib output is not byte-stable across versions, and a stale PNG
        # cannot occur without these three also being stale.
        run: |
          git diff --exit-code -- \
            coverage/navigator_layer.json \
            vendored/report.json \
            evals/results.json \
            site/index.html \
          || { echo "::error::generated artifacts are stale — run the generators and commit"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/navigator_layer.json
            coverage/coverage.png
