title: Suspicious Scheduled Task Created
id: 7b4c2f81-9d3e-4a16-b5c8-1e6f2a9d4c70
status: experimental
description: >
  Detects creation of a scheduled task whose action runs a script interpreter, a
  LOLBIN, or a binary in a user-writable location (EID 4698). Scheduled tasks are
  a common execution and persistence mechanism: attackers register tasks to run
  payloads at logon, on a timer, or as SYSTEM.

  Alerting on every 4698 was measured at a 100% false-positive rate against the
  benign half of this rule's eval set — installers, updaters and management
  agents create tasks constantly. The action content is where the signal is.
references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventID=4698
author: Can Ozmen
date: 2026-06-24
modified: 2026-06-24
tags:
  - attack.execution
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1053.005
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4698
  susp_command:
    TaskContent|contains:
      - 'powershell'
      - 'pwsh'
      - 'cmd.exe'
      - 'rundll32'
      - 'regsvr32'
      - 'mshta'
      - 'wscript'
      - 'cscript'
      - 'certutil'
      - 'bitsadmin'
      - 'FromBase64String'
      - ' -enc'
      - '.bat<'
      - '.cmd<'
      - '.vbs<'
      - '.js<'
      - '.ps1<'
  susp_location:
    TaskContent|contains:
      - '\Temp\'
      - '\Users\Public\'
      - '\AppData\'
      - '\Downloads\'
      - '\PerfLogs\'
  condition: selection and (susp_command or susp_location)
falsepositives:
  - Administrative automation that schedules a .cmd or .ps1 script. This is the
    rule's main residual false positive; baseline by task author and path.
  - Management agents whose task actions invoke an interpreter.
level: high
