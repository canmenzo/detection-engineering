description: >
  Encoded PowerShell on the command line (Sysmon EID 1). The rule requires the
  powershell.exe image (or its OriginalFileName) plus one of the -enc /
  -encodedcommand / -ec switches, each surrounded by spaces.

  The space-padded matching is the interesting property here: it is what stops
  the rule matching unrelated words containing "enc", but it also means a switch
  at the very end of a command line, or one written with an equals sign, slips
  past. Both cases are in the malicious set.
thresholds:
  min_precision: 0.80
  max_fp_rate: 0.20
  justification: >-
    A deliberate trade, measured both ways. The previous substring version scored
    precision 1.00 / FP 0.00 but recall 0.80, because it listed
    -enc/-encodedcommand/-ec and PowerShell accepts any unambiguous abbreviation
    of -EncodedCommand — so `powershell -e <base64>` walked straight past it.
    The regex closes that evasion and takes recall to 1.00; the cost is one false
    positive, a PowerShell command line passing a long base64-shaped value to an
    inner tool's -e switch. Missing a known evasion is worse than an occasional
    alert on `docker run -e`, and the residual FP is fixable by baselining the
    parent process, whereas the recall gap was only fixable by widening the
    switch match — which is what this is.

cases:
  - name: encoded_command_hidden_window
    label: malicious
    why: the canonical encoded downloader invocation
    event:
      EventID: 1
      Image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      OriginalFileName: PowerShell.EXE
      CommandLine: >-
        powershell.exe -nop -w hidden -enc SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoAZQBjAHQA
      ParentImage: C:\Windows\System32\cmd.exe

  - name: full_encodedcommand_switch
    label: malicious
    why: the long-form switch, equally common in tooling
    event:
      EventID: 1
      Image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      OriginalFileName: PowerShell.EXE
      CommandLine: >-
        powershell.exe -encodedcommand SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoAZQBjAHQA -noprofile
      ParentImage: C:\Windows\System32\wbem\WmiPrvSE.exe

  - name: short_ec_switch
    label: malicious
    why: the two-letter abbreviation PowerShell also accepts
    event:
      EventID: 1
      Image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      OriginalFileName: PowerShell.EXE
      CommandLine: powershell -ec SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoAZQBjAHQA -nop
      ParentImage: C:\Windows\explorer.exe

  - name: renamed_powershell_binary
    label: malicious
    why: >-
      renamed binary defeats an image-name check but not OriginalFileName, which
      is why the rule tests both
    event:
      EventID: 1
      Image: C:\Users\Public\svchost.exe
      OriginalFileName: PowerShell.EXE
      CommandLine: svchost.exe -enc SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoAZQBjAHQA -nop
      ParentImage: C:\Windows\System32\cmd.exe

  - name: single_letter_e_abbreviation
    label: malicious
    why: >-
      powershell.exe accepts "-e" as an abbreviation of -EncodedCommand. The
      substring version of this rule missed it; the regex closes the gap.
    event:
      EventID: 1
      Image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      OriginalFileName: PowerShell.EXE
      CommandLine: powershell.exe -nop -w hidden -e SQBFAFgAIAAoAE4AZQB3AC0ATwBiAA==
      ParentImage: C:\Windows\System32\cmd.exe

  - name: normal_admin_script_run
    label: benign
    why: ordinary script execution with no encoding switch
    event:
      EventID: 1
      Image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      OriginalFileName: PowerShell.EXE
      CommandLine: powershell.exe -NoProfile -File C:\Scripts\healthcheck.ps1
      ParentImage: C:\Windows\System32\taskeng.exe

  - name: execution_policy_bypass
    label: benign
    why: >-
      -ExecutionPolicy Bypass is suspicious in its own right but is not what this
      rule looks for; it must not match here
    event:
      EventID: 1
      Image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      OriginalFileName: PowerShell.EXE
      CommandLine: powershell.exe -ExecutionPolicy Bypass -File C:\Scripts\deploy.ps1
      ParentImage: C:\Windows\CCM\CcmExec.exe

  - name: command_mentions_encoding_word
    label: benign
    why: >-
      "-Encoding UTF8" is an -e-prefixed switch, so the switch half of the
      pattern matches it. "UTF8" is nowhere near 15 base64 characters, which is
      exactly what the argument requirement is for. This case holds that boundary.
    event:
      EventID: 1
      Image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      OriginalFileName: PowerShell.EXE
      CommandLine: powershell.exe -Command "Get-Content log.txt -Encoding UTF8"
      ParentImage: C:\Windows\System32\cmd.exe

  - name: execution_policy_long_value
    label: benign
    why: >-
      a second -e-prefixed switch with a longer argument, to prove the boundary
      is the base64 alphabet and length rather than one lucky short word
    event:
      EventID: 1
      Image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      OriginalFileName: PowerShell.EXE
      CommandLine: powershell.exe -ExecutionPolicy Unrestricted -File C:\Scripts\install.ps1
      ParentImage: C:\Windows\CCM\CcmExec.exe

  - name: inner_tool_env_var_switch
    label: benign
    why: >-
      PowerShell invoking docker, whose -e sets an environment variable to a long
      base64-shaped value. This DOES match — the honest cost of accepting every
      -e abbreviation. Parent-process baselining is the fix, not a narrower
      switch list, because narrowing reopens the evasion the regex just closed.
    event:
      EventID: 1
      Image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      OriginalFileName: PowerShell.EXE
      CommandLine: >-
        powershell.exe -Command "docker run -e APIKEYAAAABBBBCCCCDDDD1234 corp/app:latest"
      ParentImage: C:\Windows\System32\cmd.exe

  - name: encoded_word_in_a_script_path
    label: benign
    why: the text "encoded" inside a path, in no switch position
    event:
      EventID: 1
      Image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      OriginalFileName: PowerShell.EXE
      CommandLine: powershell.exe -File C:\Scripts\parse-encoded-logs.ps1
      ParentImage: C:\Windows\System32\taskeng.exe

  - name: other_binary_with_enc_switch
    label: benign
    why: a non-PowerShell tool taking an -enc argument must not match
    event:
      EventID: 1
      Image: C:\Program Files\7-Zip\7z.exe
      OriginalFileName: 7z.exe
      CommandLine: 7z.exe a -enc archive.7z C:\data
      ParentImage: C:\Windows\explorer.exe
