title: Suspicious Encoded or Obfuscated PowerShell ScriptBlock
id: 9c2e7a14-5b3d-4e6f-8a91-2d4c6b8e1f03
status: experimental
description: >
  Surfaces PowerShell ScriptBlock logging (EID 4104) containing encoding and
  obfuscation primitives emitted by Invoke-Obfuscation and malware loaders:
  base64 decoding, char-array reconstruction, integer decoding, and -bxor
  deobfuscation.

  This is a HUNTING query, not an alert. An earlier version of this description
  claimed these primitives are "rare in legitimate use"; measuring it showed the
  opposite — `-join` and `[Convert]::ToInt` appear throughout ordinary
  administrative scripting, and the rule fires on two thirds of the benign
  PowerShell in its eval set. Use it to rank script blocks for review. Turning it
  into an alert requires scoring several primitives together rather than matching
  any one of them.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
  - https://github.com/danielbohannon/Invoke-Obfuscation
author: Can Ozmen
date: 2026-06-23
modified: 2026-06-23
tags:
  - attack.execution
  - attack.stealth
  - attack.t1059.001
  - attack.t1027
logsource:
  product: windows
  category: ps_script
  definition: 'Requires PowerShell Script Block Logging (EID 4104)'
detection:
  selection:
    ScriptBlockText|contains:
      - 'FromBase64String'
      - '-bxor'
      - '[char['
      - 'char]'
      - '-join'
      - '[Convert]::ToInt'
  condition: selection
falsepositives:
  - Installer and packaging scripts that legitimately reconstruct strings from
    byte arrays. Baseline known-good script hashes before alerting at high severity.
level: informational
