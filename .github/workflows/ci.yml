name: detection-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: yamllint rules
        run: yamllint detections/
      - name: sigma check
        run: sigma check detections/
      - name: metadata + fixture discipline
        run: python tools/validate_metadata.py

  convert:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: convert to Splunk SPL
        run: |
          mkdir -p out
          sigma convert -t splunk -p pipelines/splunk.yml detections/ -o out/splunk.spl
      - name: convert to Sentinel KQL
        run: sigma convert -t kusto -p pipelines/sentinel.yml detections/ -o out/sentinel.kql

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: install hayabusa
        run: |
          HV=3.9.0
          curl -sSL -o hayabusa.zip "https://github.com/Yamato-Security/hayabusa/releases/download/v${HV}/hayabusa-${HV}-lin-x64-gnu.zip"
          mkdir -p hayabusa && unzip -q hayabusa.zip -d hayabusa
          # keep the binary alongside its bundled rules/config (conftest runs from here)
          BIN=$(find hayabusa -name 'hayabusa-*-lin-*' -type f | head -n1)
          # An empty BIN here used to export a bogus HAYABUSA_BIN, every test
          # skipped, and the build went green having verified nothing.
          test -n "$BIN" || { echo "::error::hayabusa binary not found in release archive"; exit 1; }
          chmod +x "$BIN"
          echo "HAYABUSA_BIN=$PWD/$BIN" >> "$GITHUB_ENV"
      - name: pytest (fetches pinned samples, runs Hayabusa)
        # Refuse to pass on skipped detection tests. See tests/conftest.py.
        env:
          DETKIT_REQUIRE_HAYABUSA: "1"
        run: pytest -v

  vendored:
    # Third-party SigmaHQ corpus: NOT held to the fixture gate (see vendored/README.md).
    # Proven at scale instead — every rule must batch-convert through the Splunk
    # backend, and all ATT&CK tags feed the coverage map.
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: convert + coverage report over vendored corpus
        run: python tools/vendored_report.py

  coverage:
    runs-on: ubuntu-latest
    needs: [lint, convert, test, vendored]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: generate navigator layer
        run: python tools/generate_navigator_layer.py
      - name: refresh vendored report
        run: python tools/vendored_report.py
      - name: render coverage matrix
        run: python tools/generate_coverage_png.py
      - name: render dashboard
        run: python tools/generate_dashboard.py
      - name: committed artifacts must match what the generators produce
        # Generator output is a pure function of the corpus (no timestamps), so a
        # diff here means someone changed rules without regenerating and the
        # published dashboard no longer reflects the repo. PNGs are excluded:
        # matplotlib output is not byte-stable across versions, and a stale PNG
        # cannot occur without these three also being stale.
        run: |
          git diff --exit-code -- \
            coverage/navigator_layer.json \
            vendored/report.json \
            site/index.html \
          || { echo "::error::generated artifacts are stale — run the generators and commit"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/navigator_layer.json
            coverage/coverage.png
